<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3EEE4">
<title>카드 만들기 — 21세기 괴테</title>
<link rel="apple-touch-icon" href="goethe-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="card.css?v=4">
</head>
<body>
<main class="wrap">
  <header class="top">
    <img src="goethe-icon.png" alt="" class="top__face">
    <div>
      <h1>카드 만들기</h1>
      <p>@to__twenties · 21세기 괴테</p>
    </div>
  </header>

  <!-- 열쇠는 처음 한 번만. 주소 끝 #k=… 로 열어도 저장된다 -->
  <section class="key" id="keyBox" hidden>
    <label for="key">열쇠</label>
    <div class="row">
      <input id="key" type="password" autocomplete="off" placeholder="처음 한 번만 넣으면 돼요">
      <button id="keySave" class="ghost">저장</button>
    </div>
  </section>

  <section class="write">
    <div class="row meta">
      <label>표지 날짜 <input id="date" type="date"></label>
    </div>
    <textarea id="memo" rows="9" placeholder="메모장 글을 그대로 붙여 넣으세요"></textarea>
    <div class="row">
      <button id="polish" class="main">다듬어서 카드 만들기</button>
      <button id="plain" class="ghost">그대로 나누기</button>
    </div>
    <p class="status" id="status" role="status"></p>
  </section>

  <section class="result" id="result" hidden>
    <div class="result__head">
      <b id="count"></b>
      <span>글을 고치면 바로 다시 그려져요 · <code>**말**</code> 은 형광펜</span>
    </div>
    <ol class="cards" id="cards"></ol>
    <div class="save">
      <button id="saveAll" class="main">전부 사진에 저장</button>
      <p class="hint">공유 창에서 <b>"이미지 <span id="saveN">n</span>개 저장"</b>을 누르면 사진 앱에 순서대로 들어가요</p>
    </div>
  </section>

  <!-- 같은 카드가 제자리에서 한 장씩 바뀌는 릴스 영상 (1080×1920, 소리 없음) -->
  <section class="reel" id="reel" hidden>
    <h2>릴스 영상</h2>
    <p class="hint left">카드가 제자리에서 한 장씩 바뀌는 세로 영상이에요. 음악은 인스타에서 붙여 주세요.</p>
    <div class="row">
      <select id="reelSpeed" aria-label="넘기는 속도">
        <option value="1.3">천천히</option>
        <option value="1" selected>보통</option>
        <option value="0.75">빠르게</option>
      </select>
      <button id="reelMake" class="main">릴스 영상 만들기</button>
    </div>
    <p class="status" id="reelStatus" role="status"></p>
    <video id="reelVideo" controls playsinline muted hidden></video>
    <button id="reelSave" class="main wide" hidden>영상 저장</button>
  </section>

  <details class="outro">
    <summary>마지막 장 문구</summary>
    <textarea id="outro" rows="3"></textarea>
  </details>
</main>
<script src="card.js?v=4"></script>
</body>
</html>
